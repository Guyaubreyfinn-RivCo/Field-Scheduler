<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Scheduler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --surface-2:#F1F3F6;
    --grid-line:rgba(15,27,45,0.05);
    --border:#DCE1E8;
    --text:#1B2430;
    --text-muted:#6B7686;
    --accent:#E8631C;
    --accent-soft:rgba(232,99,28,0.12);
    --scheduled:#2F6FBF;
    --progress:#C97A17;
    --done:#2E9F6B;
    --overdue:#D93D3D;
    --none:#8792A3;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
      var(--bg);
    background-size:28px 28px;
    color:var(--text);
    font-family:'Barlow Condensed', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  a{color:inherit;}

  #app{
    display:flex;
    min-height:100vh;
  }

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:250px;
    flex-shrink:0;
    background:var(--surface);
    border-right:1px solid var(--border);
    padding:20px 18px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .brand-mark{
    width:10px;height:10px;
    background:var(--accent);
    flex-shrink:0;
  }
  .brand h1{
    font-size:22px;
    font-weight:700;
    letter-spacing:0.02em;
    margin:0;
    line-height:1;
  }
  .brand small{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--text-muted);
    margin-top:3px;
    letter-spacing:0.03em;
  }

  .side-section h2{
    font-size:13px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--text-muted);
    margin:0 0 10px 0;
  }
  .search-box{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--surface-2);
    border:1px solid var(--border);
    padding:8px 10px;
  }
  .search-box input{
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    width:100%;
  }
  .search-box input::placeholder{color:var(--text-muted);}
  .search-box svg{flex-shrink:0; opacity:0.6;}

  .crew-list{
    display:flex;
    flex-direction:column;
    gap:2px;
    max-height:220px;
    overflow-y:auto;
  }
  .crew-row{
    display:flex;
    align-items:center;
    gap:9px;
    padding:6px 4px;
    cursor:pointer;
    font-size:15px;
    border-radius:2px;
  }
  .crew-row:hover{background:var(--surface-2);}
  .crew-row input{accent-color:var(--accent); width:14px; height:14px; cursor:pointer;}
  .crew-row .swatch{
    width:9px;height:9px;
    background:var(--accent);
    opacity:0.55;
    flex-shrink:0;
  }
  .crew-row span.name{font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--text);}
  .crew-toggle-all{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--accent);
    background:none;
    border:none;
    cursor:pointer;
    padding:0;
    text-decoration:underline;
    text-underline-offset:3px;
  }

  .legend{display:flex; flex-direction:column; gap:8px;}
  .legend-row{display:flex; align-items:center; gap:9px; font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--text-muted);}
  .legend-dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}

  .sidebar-footer{
    margin-top:auto;
    padding-top:14px;
    border-top:1px solid var(--border);
  }
  .source-btn{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text-muted);
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    padding:8px;
    cursor:pointer;
    text-align:left;
  }
  .source-btn:hover{color:var(--text); border-color:var(--accent);}

  /* ---------- Main ---------- */
  #main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  #topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 26px;
    border-bottom:1px solid var(--border);
    background:rgba(255,255,255,0.85);
    backdrop-filter:blur(6px);
    gap:16px;
    flex-wrap:wrap;
  }
  .month-nav{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .month-nav h2{
    font-size:26px;
    font-weight:600;
    margin:0;
    min-width:210px;
  }
  .nav-btn{
    width:30px;height:30px;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .nav-btn:hover{border-color:var(--accent); color:var(--accent);}
  .today-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    background:none;
    border:1px solid var(--border);
    color:var(--text-muted);
    padding:6px 10px;
    cursor:pointer;
  }
  .today-btn:hover{color:var(--text); border-color:var(--accent);}

  .view-toggle{
    display:flex;
    border:1px solid var(--border);
  }
  .view-toggle button{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    background:var(--surface);
    color:var(--text-muted);
    border:none;
    padding:8px 14px;
    cursor:pointer;
    letter-spacing:0.04em;
  }
  .view-toggle button.active{background:var(--accent); color:#151515; font-weight:600;}

  #content{
    flex:1;
    padding:20px 26px 30px;
    overflow-y:auto;
  }

  /* ---------- Schedule (2-week day cards) ---------- */
  .window-label{font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--text-muted); margin-left:4px;}
  .day-track{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
  }
  .day-card{
    width:190px;
    min-height:150px;
    background:var(--surface);
    border:1px solid var(--border);
    padding:9px 10px 10px;
    display:flex;
    flex-direction:column;
    gap:6px;
    cursor:pointer;
    transition:box-shadow .12s ease, border-color .12s ease;
  }
  .day-card:hover{border-color:var(--accent);}
  .day-card.today{box-shadow:inset 0 0 0 2px var(--accent);}
  .day-card.weekend{
    background:repeating-linear-gradient(135deg, rgba(15,27,45,0.02) 0px, rgba(15,27,45,0.02) 6px, transparent 6px, transparent 12px), var(--surface-2);
  }
  .day-card-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }
  .day-card-head .dow{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.08em;
    color:var(--text-muted);
  }
  .day-card-head .num{font-size:20px; font-weight:700;}
  .day-card.weekend .day-card-head .dow{color:var(--accent);}
  .day-card-tasks{display:flex; flex-direction:column; gap:4px;}
  .day-chip{
    display:flex;
    align-items:center;
    gap:5px;
    background:var(--surface-2);
    padding:3px 6px;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
  }
  .day-chip.due{
    background:#fff;
    border:1px dashed var(--accent);
    color:var(--accent);
  }
  .day-empty{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    color:var(--text-muted);
    opacity:0.6;
    margin-top:auto;
  }
  .cal-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}

  /* ---------- Later / Overdue panel ---------- */
  .later-panel{
    margin-top:28px;
    border-top:1px solid var(--border);
    padding-top:18px;
  }
  .later-panel h3{
    font-size:15px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--text-muted);
    margin:0 0 10px 0;
    font-weight:600;
  }
  .later-list{display:flex; flex-direction:column; gap:6px; margin-bottom:20px;}
  .later-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    background:var(--surface-2);
    border-left:3px solid var(--scheduled);
    padding:8px 12px;
    font-size:15px;
  }
  .later-row.overdue{border-left-color:var(--overdue);}
  .later-row .lr-title{font-weight:600;}
  .later-row .lr-meta{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--text-muted);
    white-space:nowrap;
  }


  /* ---------- Agenda ---------- */
  .agenda-group{margin-bottom:26px;}
  .agenda-date{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:10px;
    border-bottom:1px solid var(--border);
    padding-bottom:6px;
  }
  .agenda-date .num{font-size:24px; font-weight:700;}
  .agenda-date .label{font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--text-muted);}
  .agenda-cards{display:flex; flex-direction:column; gap:8px;}

  /* ---------- Task card ---------- */
  .task-card{
    background:var(--surface-2);
    border:1px solid var(--border);
    border-left:3px solid var(--scheduled);
    padding:10px 12px;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .task-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .task-wo{font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--text-muted);}
  .status-pill{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    padding:2px 7px;
    letter-spacing:0.03em;
    color:#0F1B2D;
    font-weight:600;
    white-space:nowrap;
  }
  .task-title{font-size:17px; font-weight:600; line-height:1.15;}
  .task-meta{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--text-muted);
    display:flex;
    flex-wrap:wrap;
    gap:4px 12px;
  }
  .task-meta b{color:var(--text); font-weight:500;}

  /* ---------- Drawer ---------- */
  #overlay{
    position:fixed; inset:0;
    background:rgba(6,10,18,0.55);
    display:none;
    z-index:20;
  }
  #overlay.open{display:block;}
  #drawer{
    position:fixed;
    top:0; right:0;
    height:100%;
    width:400px;
    max-width:90vw;
    background:var(--surface);
    border-left:1px solid var(--border);
    z-index:21;
    transform:translateX(100%);
    transition:transform .22s ease;
    display:flex;
    flex-direction:column;
  }
  #drawer.open{transform:translateX(0);}
  #drawer-head{
    padding:18px 20px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  #drawer-head h3{margin:0; font-size:24px; font-weight:700;}
  #drawer-close{
    background:none; border:none; color:var(--text-muted); cursor:pointer;
  }
  #drawer-close:hover{color:var(--accent);}
  #drawer-body{
    padding:16px 20px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .empty-note{
    color:var(--text-muted);
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    padding:40px 0;
    text-align:center;
  }

  /* ---------- Source popover ---------- */
  #source-pop{
    position:fixed;
    bottom:20px;
    left:20px;
    width:340px;
    max-width:85vw;
    background:var(--surface-2);
    border:1px solid var(--border);
    padding:16px;
    z-index:30;
    display:none;
    flex-direction:column;
    gap:10px;
  }
  #source-pop.open{display:flex;}
  #source-pop label{font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--text-muted); letter-spacing:0.05em;}
  #source-pop input{
    background:var(--bg);
    border:1px solid var(--border);
    color:var(--text);
    padding:8px 9px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    outline:none;
  }
  #source-pop input:focus{border-color:var(--accent);}
  #source-pop button{
    background:var(--accent);
    color:#151515;
    border:none;
    padding:9px;
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:12px;
    cursor:pointer;
  }

  #status-bar{
    padding:8px 26px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--text-muted);
    border-top:1px solid var(--border);
    display:flex;
    justify-content:space-between;
  }
  #status-bar .err{color:var(--overdue);}

  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border);}

  @media (max-width: 820px){
    #sidebar{
      position:fixed; left:0; top:0; height:100%; z-index:25;
      transform:translateX(-100%);
      transition:transform .2s ease;
    }
    #sidebar.open{transform:translateX(0);}
    .month-nav h2{font-size:20px; min-width:0;}
    #content{padding:14px 12px 24px;}
    .day-card{width:150px; min-height:120px;}
  }
</style>
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-mark"></div>
      <div>
        <h1>Field Scheduler</h1>
        <small>WORK ORDER CALENDAR</small>
      </div>
    </div>

    <div class="side-section">
      <h2>Search</h2>
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search-input" type="text" placeholder="Work order, project, task...">
      </div>
    </div>

    <div class="side-section">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h2 style="margin:0;">Crews</h2>
        <button class="crew-toggle-all" id="crew-toggle-all">clear</button>
      </div>
      <div class="crew-list" id="crew-list"></div>
    </div>

    <div class="side-section">
      <h2>Status</h2>
      <div class="legend">
        <div class="legend-row"><span class="legend-dot" style="background:var(--scheduled)"></span>Scheduled</div>
        <div class="legend-row"><span class="legend-dot" style="background:var(--progress)"></span>In progress</div>
        <div class="legend-row"><span class="legend-dot" style="background:var(--done)"></span>Complete</div>
        <div class="legend-row"><span class="legend-dot" style="background:var(--overdue)"></span>Overdue</div>
      </div>
      <div style="font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--text-muted); margin-top:10px; line-height:1.5;">
        Weekends are hidden unless the sheet schedules work on them. The board shows a rolling 2-week window; due dates further out appear in the list below it.
      </div>
    </div>

    <div class="sidebar-footer">
      <button class="source-btn" id="source-btn">⚙ SHEET SOURCE / REFRESH</button>
    </div>
  </aside>

  <main id="main">
    <div id="topbar">
      <div class="month-nav">
        <button class="nav-btn" id="prev-month">‹</button>
        <h2 id="month-label">—</h2>
        <button class="nav-btn" id="next-month">›</button>
        <button class="today-btn" id="today-btn">TODAY</button>
      </div>
      <div class="view-toggle">
        <button id="view-month" class="active">2-WEEK</button>
        <button id="view-agenda">AGENDA</button>
      </div>
    </div>
    <div id="content"></div>
    <div id="status-bar">
      <span id="status-left">Loading schedule…</span>
      <span id="status-right"></span>
    </div>
  </main>
</div>

<div id="overlay"></div>
<div id="drawer">
  <div id="drawer-head">
    <h3 id="drawer-title">—</h3>
    <button id="drawer-close">✕</button>
  </div>
  <div id="drawer-body"></div>
</div>

<div id="source-pop">
  <label>GOOGLE SHEET URL (must be shared "Anyone with the link")</label>
  <input id="sheet-url-input" type="text" value="https://docs.google.com/spreadsheets/d/1_DeFuavAd1fw_-0OPZ1Puye5Tif_uwn3RIdduv5FZzk/edit?gid=0">
  <button id="sheet-load-btn">LOAD SHEET</button>
</div>

<script>
(function(){
  "use strict";

  var STATUS_COLORS = {
    scheduled: 'var(--scheduled)',
    progress: 'var(--progress)',
    done: 'var(--done)',
    overdue: 'var(--overdue)',
    none: 'var(--none)'
  };
  var STATUS_LABELS = { scheduled:'Scheduled', progress:'In progress', done:'Complete', overdue:'Overdue', none:'Unspecified' };
  var WINDOW_DAYS = 14;

  var state = {
    rows: [],
    crews: [],
    activeCrews: new Set(),
    search: '',
    view: 'month',
    cursor: startOfDay(new Date())
  };

  // ---------- helpers ----------
  function pad(n){ return n<10 ? '0'+n : ''+n; }
  function dateKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
  function startOfDay(d){ var n = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return n; }
  function addDays(d, n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()+n); }

  function parseFlexibleDate(str){
    if(!str) return null;
    str = String(str).trim();
    if(!str) return null;
    var parts = str.split(/[\/\-]/);
    if(parts.length !== 3){
      var d2 = new Date(str);
      return isNaN(d2.getTime()) ? null : d2;
    }
    var a = parseInt(parts[0],10), b = parseInt(parts[1],10), y = parseInt(parts[2],10);
    if(isNaN(a) || isNaN(b) || isNaN(y)) return null;
    if(y < 100) y += 2000;
    var day, month;
    if(a > 12){ day = a; month = b; }
    else if(b > 12){ day = b; month = a; }
    else { day = a; month = b; } // default DD/MM as used in this sheet
    var d = new Date(y, month-1, day);
    return isNaN(d.getTime()) ? null : d;
  }

  function normalizeHeader(h){
    return String(h||'').toLowerCase().replace(/[^a-z]/g,'');
  }

  function findKey(headerMap, candidates){
    for(var i=0;i<candidates.length;i++){
      if(headerMap[candidates[i]] !== undefined) return headerMap[candidates[i]];
    }
    return null;
  }

  function classifyStatus(statusRaw, dueDate){
    var s = (statusRaw||'').toLowerCase();
    var today = startOfDay(new Date());
    if(/complete|done|closed|finished/.test(s)) return 'done';
    if(/overdue|late/.test(s)) return 'overdue';
    if(dueDate && startOfDay(dueDate) < today) return 'overdue';
    if(/progress|active|in\s*progress|working/.test(s)) return 'progress';
    return 'scheduled';
  }

  // Where a due date falls relative to "today": on the board (near), in the Later list, or Overdue.
  function dueBucket(dueDate){
    if(!dueDate) return null;
    var today = startOfDay(new Date());
    var limit = addDays(today, WINDOW_DAYS - 1);
    var d = startOfDay(dueDate);
    if(d < today) return 'overdue';
    if(d <= limit) return 'near';
    return 'later';
  }

  function sheetIdAndGidFromUrl(url){
    var idMatch = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
    var gidMatch = url.match(/gid=([0-9]+)/);
    return {
      id: idMatch ? idMatch[1] : null,
      gid: gidMatch ? gidMatch[1] : '0'
    };
  }

  // ---------- data load ----------
  function loadFromUrl(url){
    var info = sheetIdAndGidFromUrl(url);
    if(!info.id){
      setStatus('Could not parse a sheet ID from that URL.', true);
      return;
    }
    var csvUrl = 'https://docs.google.com/spreadsheets/d/' + info.id + '/gviz/tq?tqx=out:csv&gid=' + info.gid;
    setStatus('Loading schedule…', false);
    fetch(csvUrl)
      .then(function(res){
        if(!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      })
      .then(function(csvText){
        var parsed = Papa.parse(csvText.trim(), { skipEmptyLines: true });
        var raw = parsed.data;
        if(!raw || raw.length < 1){ throw new Error('Empty sheet'); }
        var headers = raw[0];
        var headerMap = {};
        headers.forEach(function(h, i){ headerMap[normalizeHeader(h)] = i; });

        var kCrew = findKey(headerMap, ['crew']);
        var kBaseCrew = findKey(headerMap, ['basecrew']);
        var kSupportCrew = findKey(headerMap, ['supportcrew']);
        var kWO = findKey(headerMap, ['workordernumber','workorder','wo']);
        var kProject = findKey(headerMap, ['projectname','project']);
        var kPhase = findKey(headerMap, ['phase']);
        var kSchedType = findKey(headerMap, ['scheduletype']);
        var kTask = findKey(headerMap, ['task']);
        var kSchedDate = findKey(headerMap, ['scheduledate']);
        var kDueDate = findKey(headerMap, ['duedate']);
        var kStatus = findKey(headerMap, ['status']);
        var kBalance = findKey(headerMap, ['accountbalance','projectbalance','balance','projectbudget','budget']);

        var knownIdx = {};
        [kCrew,kBaseCrew,kSupportCrew,kWO,kProject,kPhase,kSchedType,kTask,kSchedDate,kDueDate,kStatus,kBalance].forEach(function(i){
          if(i !== null) knownIdx[i] = true;
        });
        // Any column not mapped above (e.g. a newly added "Notes" column) is kept generically.
        var extraCols = [];
        headers.forEach(function(h, i){
          if(!knownIdx[i] && String(h||'').trim()) extraCols.push({ idx:i, label:String(h).trim() });
        });

        var rows = [];
        for(var i=1;i<raw.length;i++){
          var r = raw[i];
          if(!r || r.every(function(c){ return !c || !String(c).trim(); })) continue;
          var schedDate = kSchedDate!==null ? parseFlexibleDate(r[kSchedDate]) : null;
          var dueDate = kDueDate!==null ? parseFlexibleDate(r[kDueDate]) : null;
          if(!schedDate && !dueDate) continue; // need at least one date to place this row anywhere
          var statusRaw = kStatus!==null ? r[kStatus] : '';
          var extras = {};
          extraCols.forEach(function(c){
            var v = (r[c.idx] || '').trim();
            if(v) extras[c.label] = v;
          });
          rows.push({
            crew: kCrew!==null ? (r[kCrew]||'').trim() : '',
            baseCrew: kBaseCrew!==null ? (r[kBaseCrew]||'').trim() : '',
            supportCrew: kSupportCrew!==null ? (r[kSupportCrew]||'').trim() : '',
            workOrder: kWO!==null ? (r[kWO]||'').trim() : '',
            project: kProject!==null ? (r[kProject]||'').trim() : '(untitled project)',
            phase: kPhase!==null ? (r[kPhase]||'').trim() : '',
            schedType: kSchedType!==null ? (r[kSchedType]||'').trim() : '',
            task: kTask!==null ? (r[kTask]||'').trim() : '',
            schedDate: schedDate,
            dueDate: dueDate,
            statusRaw: statusRaw,
            status: classifyStatus(statusRaw, dueDate),
            balance: kBalance!==null ? (r[kBalance]||'').trim() : '',
            extras: extras
          });
        }

        state.rows = rows;
        var crewSet = {};
        rows.forEach(function(r){ if(r.crew) crewSet[r.crew] = true; });
        state.crews = Object.keys(crewSet).sort();
        if(state.activeCrews.size === 0){
          state.activeCrews = new Set(state.crews);
        }

        renderCrewList();
        setStatus(rows.length + ' rows loaded', false);
        document.getElementById('status-right').textContent = 'Updated ' + new Date().toLocaleTimeString();
        render();
      })
      .catch(function(err){
        setStatus('Could not load sheet — check it is shared "Anyone with the link can view". (' + err.message + ')', true);
      });
  }

  function setStatus(msg, isError){
    var el = document.getElementById('status-left');
    el.textContent = msg;
    el.className = isError ? 'err' : '';
  }

  // ---------- filtering ----------
  function filteredRows(){
    var q = state.search.trim().toLowerCase();
    return state.rows.filter(function(r){
      if(r.crew && state.activeCrews.size && !state.activeCrews.has(r.crew)) return false;
      if(q){
        var hay = (r.workOrder+' '+r.project+' '+r.task+' '+r.crew+' '+r.phase).toLowerCase();
        if(hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  // Build a dateKey -> [{row, kind:'scheduled'|'due'}] map for the given window.
  function buildWindowEntries(winStart, winEnd){
    var map = {};
    function push(k, row, kind){
      if(!map[k]) map[k] = [];
      map[k].push({ row: row, kind: kind });
    }
    filteredRows().forEach(function(r){
      if(r.schedDate && r.schedDate >= winStart && r.schedDate <= winEnd){
        push(dateKey(r.schedDate), r, 'scheduled');
      }
      if(r.dueDate && dueBucket(r.dueDate) !== 'later'){
        var sameAsSched = r.schedDate && sameDay(r.schedDate, r.dueDate);
        if(!sameAsSched && r.dueDate >= winStart && r.dueDate <= winEnd){
          push(dateKey(r.dueDate), r, 'due');
        }
      }
    });
    return map;
  }

  function buildLaterAndOverdue(){
    var later = [], overdue = [];
    var seen = {};
    filteredRows().forEach(function(r){
      if(!r.dueDate) return;
      var bucket = dueBucket(r.dueDate);
      if(bucket !== 'later' && bucket !== 'overdue') return;
      var k = (r.workOrder||r.project) + '|' + dateKey(r.dueDate);
      if(seen[k]) return;
      seen[k] = true;
      (bucket === 'later' ? later : overdue).push(r);
    });
    later.sort(function(a,b){ return a.dueDate - b.dueDate; });
    overdue.sort(function(a,b){ return a.dueDate - b.dueDate; });
    return { later: later, overdue: overdue };
  }

  // ---------- render: sidebar ----------
  function renderCrewList(){
    var list = document.getElementById('crew-list');
    list.innerHTML = '';
    state.crews.forEach(function(crew){
      var row = document.createElement('label');
      row.className = 'crew-row';
      var checked = state.activeCrews.has(crew);
      row.innerHTML = '<input type="checkbox" ' + (checked?'checked':'') + ' data-crew="' + crew.replace(/"/g,'&quot;') + '">' +
                       '<span class="swatch"></span><span class="name">' + crew + '</span>';
      list.appendChild(row);
    });
    list.querySelectorAll('input[type=checkbox]').forEach(function(cb){
      cb.addEventListener('change', function(){
        var crew = cb.getAttribute('data-crew');
        if(cb.checked) state.activeCrews.add(crew); else state.activeCrews.delete(crew);
        render();
      });
    });
  }

  // ---------- render: main ----------
  function render(){
    var winStart = state.cursor;
    var winEnd = addDays(winStart, WINDOW_DAYS - 1);
    var fmt = { month:'short', day:'numeric' };
    document.getElementById('month-label').textContent =
      winStart.toLocaleString('default', fmt) + ' – ' + winEnd.toLocaleString('default', fmt) + ', ' + winEnd.getFullYear();

    var content = document.getElementById('content');
    content.innerHTML = '';
    if(state.view === 'month'){
      content.appendChild(buildScheduleView(winStart, winEnd));
    } else {
      content.appendChild(buildAgendaView(winStart, winEnd));
    }
    content.appendChild(buildLaterPanel());
  }

  function buildScheduleView(winStart, winEnd){
    var wrap = document.createDocumentFragment();
    var entries = buildWindowEntries(winStart, winEnd);
    var today = startOfDay(new Date());

    var track = document.createElement('div');
    track.className = 'day-track';

    for(var i=0;i<WINDOW_DAYS;i++){
      var d = addDays(winStart, i);
      var dow = d.getDay(); // 0=Sun..6=Sat
      var isWeekend = (dow === 0 || dow === 6);
      var k = dateKey(d);
      var dayEntries = entries[k] || [];
      if(isWeekend && dayEntries.length === 0) continue; // hidden unless work is scheduled

      var card = document.createElement('div');
      card.className = 'day-card' + (isWeekend ? ' weekend' : '') + (sameDay(d,today) ? ' today' : '');
      card.setAttribute('data-key', k);

      var head = document.createElement('div');
      head.className = 'day-card-head';
      head.innerHTML = '<span class="dow">' + d.toLocaleString('default',{weekday:'short'}) + (isWeekend?' · scheduled':'') + '</span><span class="num">' + d.getDate() + '</span>';
      card.appendChild(head);

      var taskWrap = document.createElement('div');
      taskWrap.className = 'day-card-tasks';
      dayEntries.slice(0,4).forEach(function(e){
        var chip = document.createElement('div');
        chip.className = 'day-chip' + (e.kind === 'due' ? ' due' : '');
        if(e.kind === 'due'){
          chip.textContent = 'DUE · ' + (e.row.workOrder || e.row.task || e.row.project);
        } else {
          chip.innerHTML = '<span class="cal-dot" style="background:' + STATUS_COLORS[e.row.status] + '"></span>' +
            (e.row.crew ? e.row.crew + ' · ' : '') + (e.row.workOrder || e.row.task || e.row.project);
        }
        taskWrap.appendChild(chip);
      });
      card.appendChild(taskWrap);
      if(dayEntries.length > 4){
        var more = document.createElement('div');
        more.className = 'day-empty';
        more.textContent = '+' + (dayEntries.length-4) + ' more';
        card.appendChild(more);
      } else if(dayEntries.length === 0){
        var empty = document.createElement('div');
        empty.className = 'day-empty';
        empty.textContent = 'Nothing scheduled';
        card.appendChild(empty);
      }

      card.addEventListener('click', function(){
        var key = this.getAttribute('data-key');
        openDrawerForDate(key, entries[key] || []);
      });

      track.appendChild(card);
    }
    wrap.appendChild(track);
    return wrap;
  }

  function buildAgendaView(winStart, winEnd){
    var wrap = document.createDocumentFragment();
    var entries = buildWindowEntries(winStart, winEnd);
    var keys = Object.keys(entries).sort();
    if(keys.length === 0){
      var empty = document.createElement('div');
      empty.className = 'empty-note';
      empty.textContent = 'Nothing scheduled or due in this 2-week window.';
      wrap.appendChild(empty);
      return wrap;
    }
    keys.forEach(function(k){
      var dayEntries = entries[k];
      var d = new Date(k + 'T00:00:00');
      var group = document.createElement('div');
      group.className = 'agenda-group';
      var head = document.createElement('div');
      head.className = 'agenda-date';
      head.innerHTML = '<span class="num">' + d.getDate() + '</span><span class="label">' +
        d.toLocaleString('default',{month:'short', weekday:'long', year:'numeric'}) + '</span>';
      group.appendChild(head);
      var cards = document.createElement('div');
      cards.className = 'agenda-cards';
      dayEntries.forEach(function(e){ cards.appendChild(buildTaskCard(e.row, e.kind)); });
      group.appendChild(cards);
      wrap.appendChild(group);
    });
    return wrap;
  }

  function buildLaterPanel(){
    var wrap = document.createElement('div');
    wrap.className = 'later-panel';
    var data = buildLaterAndOverdue();

    if(data.overdue.length){
      var h1 = document.createElement('h3');
      h1.textContent = 'Overdue';
      wrap.appendChild(h1);
      var list1 = document.createElement('div');
      list1.className = 'later-list';
      data.overdue.forEach(function(r){ list1.appendChild(buildLaterRow(r, true)); });
      wrap.appendChild(list1);
    }

    var h2 = document.createElement('h3');
    h2.textContent = 'Due later (beyond 2 weeks)';
    wrap.appendChild(h2);
    if(data.later.length === 0){
      var empty = document.createElement('div');
      empty.className = 'empty-note';
      empty.style.padding = '10px 0';
      empty.textContent = 'Nothing due further out right now.';
      wrap.appendChild(empty);
    } else {
      var list2 = document.createElement('div');
      list2.className = 'later-list';
      data.later.forEach(function(r){ list2.appendChild(buildLaterRow(r, false)); });
      wrap.appendChild(list2);
    }
    return wrap;
  }

  function buildLaterRow(r, isOverdue){
    var row = document.createElement('div');
    row.className = 'later-row' + (isOverdue ? ' overdue' : '');
    var today = startOfDay(new Date());
    var days = Math.round((startOfDay(r.dueDate) - today) / 86400000);
    var daysLabel = isOverdue ? (Math.abs(days) + 'd overdue') : (days + 'd out');
    row.innerHTML =
      '<div><span class="lr-title">' + (r.workOrder ? r.workOrder + ' — ' : '') + (r.task || r.project) + '</span></div>' +
      '<div class="lr-meta">' + r.project + (r.crew ? ' · ' + r.crew : '') + ' · Due ' + r.dueDate.toLocaleDateString() + ' · ' + daysLabel + '</div>';
    row.addEventListener('click', function(){
      openDrawerForDate(dateKey(r.dueDate), [{ row:r, kind:'due' }]);
    });
    return row;
  }

  function buildTaskCard(t, kind){
    var card = document.createElement('div');
    card.className = 'task-card';
    card.style.borderLeftColor = kind === 'due' ? 'var(--accent)' : STATUS_COLORS[t.status];
    var top = document.createElement('div');
    top.className = 'task-top';
    top.innerHTML = '<span class="task-wo">' + (t.workOrder || '—') + (kind==='due' ? ' · DUE DATE' : '') + '</span>' +
      '<span class="status-pill" style="background:' + STATUS_COLORS[t.status] + '">' + STATUS_LABELS[t.status] + '</span>';
    card.appendChild(top);

    var title = document.createElement('div');
    title.className = 'task-title';
    title.textContent = t.task || t.project;
    card.appendChild(title);

    var metaBits = [];
    if(t.project) metaBits.push('<span>' + t.project + (t.phase?(' — Phase '+t.phase):'') + '</span>');
    if(t.crew) metaBits.push('<span>Crew <b>' + t.crew + '</b></span>');
    if(t.baseCrew) metaBits.push('<span>Base <b>' + t.baseCrew + '</b></span>');
    if(t.supportCrew) metaBits.push('<span>Support <b>' + t.supportCrew + '</b></span>');
    if(t.schedType) metaBits.push('<span>' + t.schedType + '</span>');
    if(t.schedDate) metaBits.push('<span>Scheduled <b>' + t.schedDate.toLocaleDateString() + '</b></span>');
    if(t.dueDate) metaBits.push('<span>Due <b>' + t.dueDate.toLocaleDateString() + '</b></span>');
    if(t.balance) metaBits.push('<span>Balance <b>' + t.balance + '</b></span>');
    Object.keys(t.extras || {}).forEach(function(label){
      metaBits.push('<span>' + label + ' <b>' + t.extras[label] + '</b></span>');
    });
    var meta = document.createElement('div');
    meta.className = 'task-meta';
    meta.innerHTML = metaBits.join('');
    card.appendChild(meta);

    return card;
  }

  // ---------- drawer ----------
  function openDrawerForDate(key, dayEntries){
    var d = new Date(key + 'T00:00:00');
    document.getElementById('drawer-title').textContent = d.toLocaleString('default',{month:'short', day:'numeric', year:'numeric'});
    var body = document.getElementById('drawer-body');
    body.innerHTML = '';
    if(!dayEntries || dayEntries.length === 0){
      var empty = document.createElement('div');
      empty.className = 'empty-note';
      empty.textContent = 'Nothing scheduled this day.';
      body.appendChild(empty);
    } else {
      dayEntries.forEach(function(e){ body.appendChild(buildTaskCard(e.row, e.kind)); });
    }
    document.getElementById('overlay').classList.add('open');
    document.getElementById('drawer').classList.add('open');
  }

  function closeDrawer(){
    document.getElementById('overlay').classList.remove('open');
    document.getElementById('drawer').classList.remove('open');
  }

  // ---------- wiring ----------
  document.getElementById('prev-month').addEventListener('click', function(){
    state.cursor = addDays(state.cursor, -WINDOW_DAYS);
    render();
  });
  document.getElementById('next-month').addEventListener('click', function(){
    state.cursor = addDays(state.cursor, WINDOW_DAYS);
    render();
  });
  document.getElementById('today-btn').addEventListener('click', function(){
    state.cursor = startOfDay(new Date());
    render();
  });
  document.getElementById('view-month').addEventListener('click', function(){
    state.view = 'month';
    document.getElementById('view-month').classList.add('active');
    document.getElementById('view-agenda').classList.remove('active');
    render();
  });
  document.getElementById('view-agenda').addEventListener('click', function(){
    state.view = 'agenda';
    document.getElementById('view-agenda').classList.add('active');
    document.getElementById('view-month').classList.remove('active');
    render();
  });
  document.getElementById('search-input').addEventListener('input', function(e){
    state.search = e.target.value;
    render();
  });
  document.getElementById('crew-toggle-all').addEventListener('click', function(){
    if(state.activeCrews.size === state.crews.length){
      state.activeCrews = new Set();
      this.textContent = 'select all';
    } else {
      state.activeCrews = new Set(state.crews);
      this.textContent = 'clear';
    }
    renderCrewList();
    render();
  });
  document.getElementById('drawer-close').addEventListener('click', closeDrawer);
  document.getElementById('overlay').addEventListener('click', closeDrawer);

  document.getElementById('source-btn').addEventListener('click', function(){
    document.getElementById('source-pop').classList.toggle('open');
  });
  document.getElementById('sheet-load-btn').addEventListener('click', function(){
    var url = document.getElementById('sheet-url-input').value.trim();
    if(url) loadFromUrl(url);
    document.getElementById('source-pop').classList.remove('open');
  });

  // ---------- boot ----------
  loadFromUrl(document.getElementById('sheet-url-input').value.trim());
  render();

})();
</script>
</body>
